<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      box-sizing: border-box;
    }

    .body {
      height: 100vh;
    }
    .container {
      width: 100%;
    }


    .kotak {
      border: 3px solid black;
      border-radius: 5px;
      background-color: aqua;
    }

    .kotak {
      margin: 25px;
      height: 20vh;
    }

    .kotakTengah {
      display: flex;
    }

    .kotakTengah div{
      margin: 25px;
    }

    .kotak2 {
      border: 3px solid black;
      border-radius: 5px;
      background-color: brown;
      width: 25%;
      height: 30vh;
    }
    
    .kotak3 {
      border: 3px solid black;
      border-radius: 5px;
      background-color: cadetblue;
      width: 100%;
      height: 30vh;
    }

    .kotakBawah {
      display: flex;
    }

    .kotakBawah div {
      margin: 25px;
    }

    .kotak4 {
      border: 3px solid black;
      border-radius: 5px;
      background-color:burlywood;
      width: 25%;
      height: 30vh;
    }
    
    .kotak5 {
      border: 3px solid black;
      border-radius: 5px;
      background-color: chocolate;
      width: 100%;
      height: 30vh;
    }
  </style>
</head>
<body>
  
  <div class="container">
    <div class="kotak"></div>

    <div class="kotakTengah">
      <div class="kotak2"></div>
      <div class="kotak3"></div>  
    </div>

    <div class="kotakBawah">
      <div class="kotak4"></div>
      <div class="kotak5"></div>  
    </div>
  </div>


</body>

</html>
