<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>latihan 6 - flexBox</title>
    <style>

        .container {
            display: flex;
            justify-content: space-around;
            padding: 25px;
        }
        .kotak {
            text-align: center;
            border: 1px solid black;
            width: 98%;
            height: 750px;
            margin: 10px;
            color: white;
        }

        .item1 {
            background-color: blue;
        }

        .item2 {
            background-color: 
            red;
        }
        .item3 {
            background-color: 
            yellow;
        }

        .item4 {
            background-color: pink;
        }
        
    </style>
</head>
<body>
<div class="container">
    <div class="kotak item1">1</div>
    <div class="kotak item2">2</div>
    <div class="kotak item3">3</div>
    <div class="kotak item4">4</div>
</div>
</body>
</html>
