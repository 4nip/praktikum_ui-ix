<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurs Rupiah</title>
</head>
<body>
    <!-- dolar -->
    <h2>Dolar to Rupiah</h2>
    <h4>Nilai Kurs Rupiah : Rp 16.000 </h4> 
    <label for="dolar">Dolar : </label>
    <input type="number" id="dolar">
    <br>
    <span id="hasil_dolar"></span>
    <br>
    <button onclick="hitung_dolar()">HITUNG</button>
    <br>

    <hr>

    <!-- rupiah -->
    <h2>Rupiah to Dolar</h2>
    <h4>Nilai Kurs Rupiah : Rp 16.000 </h4>
    <label for="rupiah">Rupiah : </label>
    <input type="number" id="rupiah">
    <br>
    <span id="hasil_rupiah"></span>
    <br>
    <button onclick="hitung_rupiah()">HITUNG</button>

    <script>
        // dolar
        function hitung_dolar() {
            let rp = 16000;
            let d = document.getElementById("dolar").value;
            let h = d * rp
            document.getElementById("hasil_dolar").innerHTML = "Hasil = Rp." + h.toLocaleString()
        }

        // rupiah
        function hitung_rupiah() {
            let rp2 = document.getElementById("rupiah").value;
            let h = rp2 / 16000
            document.getElementById('hasil_rupiah').innerHTML = "Hasil = $" + h.toFixed(2)
        }
    </script>
</body>
</html>
