<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menghitung Luas Dan Keliling</title>
</head>
<body>
    <h1>Menghitung Luas Dan Keliling</h1>
    <label for="jariJari">Jari-Jari (r) : </label>
    <input id="jariJari" type="number" placeholder="contoh 7"> <br>

    <button onclick="hitungLingkarang()">Hitung</button>
    
    
    <div id="hasil">
        <h3>Hasil anda akan tampil di sini</h3>
    </div>

    <script>
        function hitungLingkarang(){
            let jariJariInput = document.getElementById("jariJari");
            let r = parseFloat(jariJariInput.value)

            const PI = Math.PI;
            const hasilDiv = document.getElementById("hasil")

            if (isNaN(r) ||  r <= 0) {
                hasilDiv.innerHTML = "<h3>Nilai jari Jari yang anda masukan tidak valid, masukan ulang nilainya!</h3>"
                return;
            }

            const luas = PI * r * r ;
            const Keliling = 2 * PI * r;

            hasilDiv.innerHTML = `
            <h3>Hasil Perhitungan : </h3>
            <p>Jari Jari Adalah <strong>${r}</strong></p>
            <p>Luas Lingkaran Anda Adalah <strong>${luas.toFixed(3)}</strong></p>
            <p>Keliling Lingkaran Anda Adalah <strong>${Keliling.toFixed(3)}</strong></p>
            `
        }

    </script>
</body>
</html>
