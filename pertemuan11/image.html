<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        img {
            width: 300px; 
            height: auto;
            border: 1px solid #ccc;
            margin-top: 15px;
            display: none; 
        }
        #imgDisplay {
            min-height: 350px; 
        }
        #placeholder {
            display: block; 
            color: #777;
        }
    </style>
</head>
<body>                 
    <select id="imgSelect" onchange="displayImg(this.value)">
        <option>Pilih Salah Satu</option>
        <option value="Kucing">Kucing</option>
        <option value="Tikus">Tikus</option>
        <option value="Macan">Macan</option>
        <option value="Musang">Musang</option>
        <option value="Citah">Citah</option>
        <option value="Gorila">Gorila</option>
    </select>

    <div id="imgDisplay">

        <p id="placeholder">Gambar akan muncul disini</p>

        <img id="Kucing" src="https://4.bp.blogspot.com/-5x8gaxs6CXo/V5bOSRfdoCI/AAAAAAAACSs/7lWkZp-JbSY9OcLUvd2sWjhIPkFhbhlAACLcB/s1600/Gambar-kucing-5.JPG" alt="Kucing">
        <img id="Tikus" src="https://th.bing.com/th/id/R.27b2abbdd3b7bf5db9f727a080a02d48?rik=CuYLqtD6aoFwjg&riu=http%3a%2f%2f2.bp.blogspot.com%2f-zn5j7JLhkyc%2fULrCvWNnUfI%2fAAAAAAAAEMA%2fQrl-kxgkWAg%2fs1600%2fgambar%2btikus%2b4.jpg&ehk=y1jUrVuJPDapllGZ5ASlM0Av2xx3l6mHd9U6nOYOwnI%3d&risl=&pid=ImgRaw&r=0" alt="Tikus">
        <img id="Macan" src="https://cdn.pixabay.com/photo/2017/06/16/05/11/white-tiger-2407799_1280.jpg" alt="Macan">
        <img id="Musang" src="https://artikel.rumah123.com/wp-content/uploads/sites/41/2023/05/09165053/musang-masuk-rumah-pertanda-apa.jpg" alt="Musang">
        <img id="Citah" src="https://tse3.mm.bing.net/th/id/OIP.xSKyIoEPDMPggacz31tgGQAAAA?cb=ucfimg2&ucfimg=1&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Citah">
        <img id="Gorila" src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/bb/Gorille_des_plaines_de_l%27ouest_%C3%A0_l%27Espace_Zoologique.jpg/1200px-Gorille_des_plaines_de_l%27ouest_%C3%A0_l%27Espace_Zoologique.jpg" alt="Gorila">
    </div>

    <script>
        function displayImg(fileName) {
            const displayArea = document.getElementById('imgDisplay');
            const img = displayArea.querySelectorAll('img');
            const placeholder = document.getElementById('placeholder')

            img.forEach(function (img) {
                img.style.display = 'none';
            });

            const selectedImg = document.getElementById(fileName);

            if (selectedImg) {
                placeholder.style.display = 'none';
                selectedImg.style.display = 'block';

                alert('Ini Gambar ' + fileName);
            } else {
                placeholder.style.display = 'block';
            }
        }

    </script>
</body>
</html>
