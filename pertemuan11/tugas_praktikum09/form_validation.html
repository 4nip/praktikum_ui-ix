<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Form Validation</h1>
    <form>
        <label for="nama">Nama : </label>
        <input type="text" id="nama" placeholder="maksimum 30 karakter" required> <span id="errorName"></span>

        <br>
        <br>

        <label for="email">Email : </label>
        <input type="email" id="email" placeholder="masukan email anda" required> <span id="errorEmail"></span>

        <br>
        <br>

        <label for="jam">Jam Keberangkatan : </label>
        <input type="time" id="jam" placeholder="masukan jam Keberangkatan" required> <span id="errorJam"></span>

        <br>
        <br>

        <label for="tujuan">Tujuan : </label>
        <input type="text" id="tujuan" placeholder="masukan tempat tujuan" required> <span id="errorTujuan"></span>

        <br>
        <br>

        <label for="tiket">Jumlah Tiket : </label>
        <input type="number" id="tiket" placeholder="isi jumlah tiktek"> <span id="errorTiket"></span>

        <input type="button" value="submit" onclick="formValidation()">
    </form>

    <div>
        <h1 id="hasil"></h1>
        <p id="hasilName"></p>
        <p id="hasilEmail"></p>
        <p id="hasilJam"></p>
        <p id="hasilTujuan"></p>
        <p id="hasilTiket"></p>
    </div>

    <script>
        function formValidation() {
            let nama = document.getElementById('nama').value;
            let email = document.getElementById('email').value;
            let jam = document.getElementById('jam').value;
            let tujuan = document.getElementById('tujuan').value;
            let tiket = document.getElementById('tiket').value;
            
            let hasil = (document.getElementById('hasil').innerHTML = "Validasi Data")

            if (nama.toLowerCase() == "Hanna" && email == "kyuu@gmail.com" && jam == "06:00" && tujuan.toLowerCase() == "Kalimantan" && tiket == "3") {
                document.getElementById("hasilNama").innerHTML = "Nama Pelanggan : " + nama;
                document.getElementById("hasilEmail").innerHTML = "Email : " + email;
                document.getElementById("hasilJam").innerHTML = "Jam Keberangkatan : " + jam;
                document.getElementById("hasilTujuan").innerHTML = "Tujuan : " + tujuan;
                document.getElementById("hasilTiket").innerHTML = "Tiket : " + tiket;
            }

            if (nama.toLowerCase() != "Hanna" || email != "kyuu@gmail.com") {
                document.getElementById("errorName").innerHTML = " DATA TIDAK DITEMUKAN";
                document.getElementById("errorName").style = "color:red";
                document.getElementById("errorEmail").innerHTML = " DATA TIDAK DITEMUKAN";
                document.getElementById("errorEmail").style = "color:red";
            }

            if (jam != "06:00") {
                document.getElementById("errorJam").innerHTML = " DATA TIDAK DITEMUKAN";
                document.getElementById("errorJam").style = "color:red";
            }

            if (tujuan.toLowerCase() != "Kalimantan" || tiket != "3") {
                document.getElementById("errorTujuan").innerHTML = " DATA TIDAK DITEMUKAN";
                document.getElementById("errorTujuan").style = "color:red";
                document.getElementById("errorTiket").innerHTML = " DATA TIDAK DITEMUKAN";
                document.getElementById("errorTiket").style = "color:red";
            }
        }
        
    </script>
</body>
</html>
