<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login User</title>
    <script src="otentikasi.js"></script>
    <style>
        fieldset {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <fieldset>
        <legend>Login Authentication</legend>
        <form action="">
            <table border="0">
                <tbody>
                    <td><label for="userName">User Name</label></td>
                    <td> : </td>
                    <td><input type="text" id="userName" placeholder="Masukan User Name Anda"></td>
                </tbody>
                <tbody>
                    <td><label for="password">Password</label></td>
                    <td> : </td>
                    <td><input type="password" id="password" placeholder="Masukan Password Anda"></td>
                </tbody>
            </table>
            <br>
        <input type="button" value="Login" onclick="loginValidation()">
        </form>
    </fieldset>
</body>
</html>
