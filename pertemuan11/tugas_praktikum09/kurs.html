<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurs</title>
</head>
<body>
    <form >
        <fieldset style="background-color: antiquewhite;">
            <legend>Kurs Mata Uang</legend>
            <table border="1">
                <thead>
                    <th>Masukan Nilai</th>
                    <th>Valas</th>
                    <th>Nilai Rupiah</th>
                </thead>
                <tbody>
                    <td><input type="number" id="uang"></td>
                        <td>
                            <select id="pilih">
                                <option>Pilih</option>
                                <option value="usd">Dollar Us</option>
                                <option value="sd">Dollar Singapore </option>
                                <option value="rm">Ringgit Malaysia</option>
                                <option value="yen">Yen Jepan</option>
                                <option value="eu">Euro</option>
                                <option value="riyal">Riyal Arab Saudi</option>
                            </select>
                        </td>
                        <td><input type="number" id="konversi"></td>
                </tbody>
            </table>
        </fieldset>
    </form>
    <script>
        let userpilih = document.getElementById('pilih');

        userpilih.onchange = function() {
            let uang = document.getElementById('uang').value;
            
            if (pilih.value == 'usd' ) {
                document.getElementById('konversi').value = uang * 16000;
            } else if (pilih.value == 'sd') {
                document.getElementById('konversi').value = uang * 13472;
            } else if (pilih.value == 'rm') {
                document.getElementById('konversi').value = uang * 3000;
            } else if (pilih.value == 'yen') {
                document.getElementById('konversi').value = uang * 120;
            } else if (pilih.value == 'eu') {
                document.getElementById('konversi').value = uang * 15888;
            } else if (pilih.value == 'riyal') {
                document.getElementById('konversi').value = uang * 3592;
            } else {
                document.getElementById('konversi').value = 'Anda Tidak Memiliki Apapun';
            }
        }
    </script>
</body>
</html>
