<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container {
            display: flex;
            flex-direction: row-reverse;
            justify-content: center;
        }

        .box {
            font-size: 90pt;
            text-align: center;
            border: 2px solid black;
            border-radius: 10px;
            padding: 0px 20px;
            margin: 10px;
        }

        .box4 {
            order: 1;
        }

    </style>
</head>
<body>
    <div id="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
    </div>

</body>
</html>
